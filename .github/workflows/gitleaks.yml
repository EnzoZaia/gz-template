name: gitleaks

# Procura segredos (senhas, tokens, chaves) em todo o histórico do repositório.
# A mesma regra roda antes do commit no computador (.githooks/pre-commit).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rodar gitleaks (versão fixa)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0='*' \
            zricethezav/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner
